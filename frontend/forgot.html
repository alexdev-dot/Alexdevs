<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password</title>
  <link rel="stylesheet" href="forgot.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>

  <!-- Back to login -->
  <a href="login.html" class="back-arrow" title="Go back to login">
    <i class="fa fa-arrow-left" aria-hidden="true"></i>
  </a>


  <div class="background"></div>
  <div class="container">
    <form id="forgotForm" class="glass-card" autocomplete="on" novalidate>
      <div id="step1">
        <h2>Forgot Password</h2>
        <p>Enter your email to receive a 6-digit OTP</p>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="your@example.com" required />

        <button type="button" id="sendOTPBtn">Send OTP</button>
      </div>

      <div id="step2" class="hidden">
        <h2>Verify OTP</h2>
        <p>Enter the code sent to your email and your new password</p>

        <label for="otp">OTP Code</label>
        <input type="text" id="otp" name="otp" placeholder="123456" maxlength="6" />

        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" name="newPassword" placeholder="........" />

        <button type="submit">Reset Password</button>
      </div>

      <div id="statusMsg" style="margin-top: 15px; text-align: center; font-size: 0.9rem;"></div>

      <div class="footer">
        <p>Remembered your password? <a href="login.html">Login</a></p>
      </div>
    </form>
  </div>

  <script src="forgot.js" defer></script>
</body>
</html>
